<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

  <div class="card shadow-sm p-4" style="width: 100%; max-width: 380px;">
    <div class="card-body">
      <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
      
      <form id="formLogin">
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario:</label>
          <input type="text" class="form-control" id="usuario" placeholder="nombre" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="contrasena" placeholder="••••••••" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Recordarme</label>
          </div>
          <a href="#" class="text-decoration-none small">¿Olvidaste tu contraseña?</a>
        </div>

        <div class="d-grid">
          <button type="button" class="btn btn-primary" onclick="iniciarSesion();">Entrar</button>
        </div>
      </form>
      
      <article>
        <p id="errorLogin" class="mensaje-error"></p>
      </article>

      <div class="text-center mt-3">
        <span class="small text-muted">¿No tienes cuenta? <a href="#" class="text-decoration-none">Regístrate</a></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
