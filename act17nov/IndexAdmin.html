<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        .card-modern {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .btn-indigo {
            background-color: #4f46e5;
            border-color: #4f46e5;
            color: #fff;
        }
        .btn-indigo:hover:not(:disabled) {
            background-color: #4338ca;
            border-color: #4338ca;
            color: #fff;
        }
        .btn-indigo:disabled {
            background-color: #a5b4fc;
            border-color: #a5b4fc;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom py-3 mb-5 shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold tracking-tight fs-4 mb-0">
                Panel Admin
            </span>

            <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center gap-2">
                    <div id="foto"></div>
                    <span class="text-white fw-semibold" id="bienvenidoUsuario">Bienvenido</span>
                </div>

                <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4 align-items-start">
            
            <div class="col-lg-4">
                <div class="card card-modern">
                    <div class="card-body p-4">
                        <h5 class="fw-bold text-dark mb-1">Agregar Producto</h5>
                        <p class="text-muted small mb-4">Completa los datos para registrar un artículo.</p>
                        
                        <form id="formProducto" class="row g-3">
                            <!-- Input oculto necesario para saber si es nuevo o edición -->
                            <input type="hidden" id="idProducto" value="">

                            <div class="col-12">
                                <label for="nombreProducto" class="form-label fw-semibold small text-secondary">Nombre del producto</label>
                                <input type="text" class="form-control form-control-lg bg-light border-0 fs-6" id="nombreProducto" placeholder="Ej. Tenis Deportivos" required>
                            </div>
                            <div class="col-12">
                                <label for="precioProducto" class="form-label fw-semibold small text-secondary">Precio ($)</label>
                                <input type="number" step="0.01" min="0" class="form-control form-control-lg bg-light border-0 fs-6" id="precioProducto" placeholder="0.00" required>
                            </div>
                            <div class="col-12 d-grid mt-4">
                                <button type="button" id="btnGuardar" onclick="guardarProducto()" class="btn btn-indigo btn-lg rounded-pill fs-6 fw-semibold">
                                    Guardar Producto
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card card-modern overflow-hidden">
                    <div class="card-header bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold text-dark mb-0">Productos Guardados</h5>
                        <span class="badge rounded-pill bg-primary-subtle text-primary px-3 py-2 fw-semibold" id="contadorProductos">
                            0 productos
                        </span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="table-light text-secondary small text-uppercase">
                                    <tr>
                                        <th scope="col" class="ps-4 py-3">ID</th>
                                        <th scope="col" class="py-3">Producto</th>
                                        <th scope="col" class="py-3">Precio</th>
                                        <th scope="col" class="text-end pe-4 py-3">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaProductos" class="border-top-0">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
