<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Agenda</title>
</head>
<body>
    <header class="container-fluid p-5 bg-primary text-white text-center">
        <h1>Agenda Semanal</h1>
        <p>Arreglo bidimensional de 7 días x 3 datos</p>
    </header>
    <section class="container mt-5">
        <div class="row">
          <article class="col-sm-4">
            <h3>Nuevo evento</h3>
            <form action="#">
                <label>Día</label>
                <select id="dia" class="form-select">
                    <option value="0">Lunes</option>
                    <option value="1">Martes</option>
                    <option value="2">Miercoles</option>
                    <option value="3">Jueves</option>
                    <option value="4">Viernes</option>
                    <option value="5">Sabado</option>
                    <option value="6">Domingo</option>
                </select><br>
                <label>Hora</label>
                <input type="time" id="hora" class="form-control"><br>
                <label>Evento</label>
                <input type="text" id="evento" class="form-control"><br>
                <label>Descripción</label>
                <input type="text" id="descripcion" class="form-control"><br>
                <button type="button" class="btn btn-warning" onclick="guardar()">Guardar</button>
            </form>
          </article>
          <article class="col-sm-8">
            <h3>Semana</h3>
            <article id="impAgenda"></article>
          </article>
        </div>
    </section>
    <script src="js/agenda.js"></script>
</body>
</html>
