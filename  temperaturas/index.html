<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Temperaturas</title>
</head>
<body>
    <header class="container-fluid p-5 bg-primary text-white text-center">
        <h1>Temperaturas de la Semana</h1>
        <p>Captura de la temperatura promedio de los 7 días</p>
    </header>
    <section class="container mt-5">
        <div class="row">
          <article class="col-sm-6">
            <h3>Captura de temperaturas</h3>
            <button class="btn btn-warning" onclick="cargar()">Capturar 7 temperaturas</button>
            <button class="btn btn-success" onclick="mostrar()">Mostrar temperaturas</button>
            <hr>
            <article id="listaT"></article>
          </article>
          <article class="col-sm-6">
            <h3>Resultados</h3>
            <button class="btn btn-warning" onclick="calcular()">Calcular</button>
            <hr>
            <p id="impPromedio"></p>
            <p id="impMaxima"></p>
            <p id="impMinima"></p>
          </article>
        </div>
    </section>
    <script src="js/tem.js"></script>
</body>
</html>
