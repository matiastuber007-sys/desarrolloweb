<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Calificaciones</title>
</head>
<body>
    <header class="container-fluid p-5 bg-primary text-white text-center">
        <h1>Calificaciones</h1>
        <p>Captura de 10 calificaciones, cortar y vaciar</p>
    </header>
    <section class="container mt-5">
        <div class="row">
          <article class="col-sm-6">
            <h3>Captura</h3>
            <button class="btn btn-warning" onclick="cargar()">Capturar 10 calificaciones</button>
            <button class="btn btn-success" onclick="mostrar()">Mostrar calificaciones</button>
            <hr>
            <article id="impCalificaciones"></article>
          </article>
          <article class="col-sm-6">
            <h3>Modificar</h3>
            <button class="btn btn-warning" onclick="cortar()">Cortar</button>
            <button class="btn btn-warning" onclick="vaciar()">Vaciar</button>
            <hr>
            <article id="impCambio"></article>
          </article>
        </div>
    </section>
    <script src="js/cal.js"></script>
</body>
</html>
