<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta author="Anahí Torres">
    <meta keywords="desarrollo web, ingeniería de software">
    <!--Vínculo a estilos-->
    <link rel="stylesheet" href="css/estilo.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>Sueldo</title>

</head>
<body>
        <main>
            <section id="principal">
                <article>
                  <form name= "datos_sueldo" method= "post" action= "#" enctype="multipart/form-data">
                    <fieldset id="sueldo_cat">
                        <legend>Sueldo</legend>
                        <p>
                            <label>Sueldo:</label>
                            $ <input type="number" id="sueldo" min="0"/> <br>
                        </p>
                        <p>
                            <label>Categoría:</label>
                            <select id="categoria">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </p>

                        <ol id="categorias">
                            <li>Soporte 20%</li>
                            <li>Project Manager 40%</li>
                            <li>Programador Jr 25%</li>
                            <li>Programador Sr 35%</li>
                        </ol>

                        <p id="dguardar">
                            <button type="button" id="boton" onclick="mi_metodo()" ><span class="material-symbols-outlined">calculate</span> Calcular</button>
                        </p>

                        <p id="resultado">
                            R: <span id="total">______</span> sueldo con aumento
                        </p>

                    </fieldset>
                  </form>
                </article>
            </section>
        </main>
        
        <footer>
            <article id="grupo" class="pie"><span class="material-symbols-outlined">groups</span> LDSM405</article>
            <article id="contacto" class="pie">
                <span class="material-symbols-outlined">person</span> <i>Josue Matias Navarro Vargas</i>
            </article>
        </footer>
      <script src="js/script.js"></script>
</body>
</html>
