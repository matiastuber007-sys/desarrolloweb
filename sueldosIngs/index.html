<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Sueldos Ingenieros</title>
</head>
<body>
    <header class="container-fluid p-5 bg-primary text-white text-center">
        <h1>Sueldos de Ingenieros</h1>
        <p>Cálculo de sueldo con arreglo bidimensional</p>
    </header>
    <section class="container mt-5">
        <div class="row">
          <article class="col-sm-6 mx-auto">
            <h3>Calcular sueldo</h3>
            <form action="#">
                <label>Puesto</label>
                <select id="puesto" class="form-select">
                    <option value="0">Diseñador</option>
                    <option value="1">Programador</option>
                    <option value="2">Lider</option>
                </select><br>
                <label>Nivel</label>
                <select id="nivel" class="form-select">
                    <option value="0">Newbe</option>
                    <option value="1">Jr</option>
                    <option value="2">Sr</option>
                </select><br>
                <label>Hrs Trabaja</label>
                <input type="number" min="0" id="horas" class="form-control"><br>
                <button type="button" class="btn btn-warning" onclick="calcular()">Calcular</button>
            </form>
            <hr>
            <p id="impTotal"></p>
          </article>
        </div>
    </section>
    <script src="js/ings.js"></script>
</body>
</html>
