<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta author="Anahí Torres">
    <meta keywords="desarrollo web, ingeniería de software">
    <!--Vínculo a estilos-->
    <link rel="stylesheet" href="css/estilo.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>Número Secreto</title>

</head>
<body>
        <main>
            <section id="principal">
                <article>
                  <form name= "datos_secreto" method= "post" action= "#">
                    <fieldset id="secreto">
                        <legend>Número Secreto</legend>
                        <p id="nota">
                            Adivina el número del 1 al 10. Tienes 3 oportunidades.
                        </p>
                        <p>
                            <label>Número:</label>
                            <select id="numero">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                            </select>
                        </p>

                        <p id="dguardar">
                            <button type="button" id="boton" onclick="mi_metodo()" >Adivinar</button>
                        </p>

                        <p id="resultado">
                            <span id="mensaje"></span>
                        </p>

                    </fieldset>
                  </form>
                </article>
            </section>
        </main>
        
        <footer>
            <article id="grupo" class="pie"><span class="material-symbols-outlined">groups</span> LDSM405</article>
            <article id="contacto" class="pie">
                <span class="material-symbols-outlined">person</span> <i>Josue Matias Navarro Vargas</i>
            </article>
        </footer>
      <script src="js/script.js"></script>
</body>
</html>
