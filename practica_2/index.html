</head>
<body>
        <header>
            <img src="img/LogoErick.png" width="100" height="100" alt="Imagen logotipo de marca" title="Logotipo" /> 
            <nav>
                <ul>
                    <li><a href="index.html" target="_parent">Registro</a></li>
                    <li><a href="contacto.html" target="_parent">Opción 2</a></li>
                    <li><a href="https://www.youtube.com/" target="_blank">Opción 3</a></li>
                    <li><a>Opción 4</a></li>
                    <li><a>Opción 5</a></li>  
                </ul>
            </nav>
        </header>
        <main>
            <section id="principal">
                <article>
                  <form name= "datos_usuario" method= "post" action= "#" enctype="multipart/form-data"></form>
                    <fieldset>
                        <legend>Datos de Registro:</legend>
                        <div id="dregistro">
                            <label>Fecha de registro:</label>
                            <input type="date" id="fecha" /><br> 
                        </div>
                    </fieldset>
                    <fieldset id="datos_user"> 
                        <legend>Datos del usuario:</legend>
                        <div id="nombre_completo">
                            <div> <label>Nombre: </label>
                            <input type="text" id="nombre"/> <br>
                            </div>
                           <div>
                            <label>Apellido Paterno: </label>
                            <input type="text" id="apellidop"/> <br> 
                            </div>
                            <div>
                            <label>Apellido Materno:</label>
                            <input type="text" id="apellidom"/> <br> 
                            </div>
                        </div>
                        <div id="otros_datos"> 
                            <div id="tipo_sangre">
                                <label>Tipo de Sange:</label>
                                <input type="radio" name="tsangre" id="tsangre" value="O+"/>0+
                                <input type="radio" name="tsangre" id="tsangre" value="A"/>A
                                <input type="radio" name="tsangre" id="tsangre" value="B">B
                                <input type="radio" name="tsangre" id="tsangre" value="AB">AB
                                
                            </div>
                            <div id="genero">
                                <label> Género:</label>
                                    <input type="radio" id="generoU" value="Femenino"/>F
                                     <input type="radio" id="generoU" value="Masculino"/>M
                            </div>
                            <div>
                                <label> Ciudad de Origen</label>
                               <select id="ciudad">
                                  <option value="SFR">San Francisco</option>
                                  <option value="CRM">Cueramaro</option>
                                 <option value="LEO">Leon</option>    
                                                              
                                </select><br>
                            </div>
                            <div>
                                <label>Foto:</label>
                                <input type="file" id="imagen"/> <br>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Datos del inicio de sesión</legend>
                        <div>
                            <label>Email </label>
                        <input type="email" id="correo" required autofocus placeholder="a@mail.com"/> <br>
                        </div>
                        <div>
                            <label>Contraseña</label>
                           <input type="password" id="contrasenia" required minlength="9" maxlength="9"/>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Generalidades </legend>
                        <div>
                            <label>Color Favorito:</label>
                            <input type="color" id="colorf"/>
                        </div>
                        <div>
                            <label>Comentarios</label>
                           <textarea cols="10" rows="10" id="comentarios"> </textarea>
                        </div>
                    </fieldset> 
                    <button id="boton" onclick="mi_metodo()" >Registrar</button>
                </form>
                </article>
            </section>
        </main>
        <footer>
